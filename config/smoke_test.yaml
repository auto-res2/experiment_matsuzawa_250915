run_name: smoke_test
seeds: [1]
dataset:
  name: ogbn-papers400m
  root: data/
  use_subset: true   # ≤50 000 nodes for quick run
model:
  arch: craft
  num_layers: 2
  hid_dim: 64
  cheb_K: 4
  pool_size: 16
  dp_sigma: 0.3
  curvature_lambda: 0.05
  energy_lambda: 1.0e-4
train:
  epochs: 2
  lr: 1.0e-3
  batch_size: full
  zero_stage: 1
  clip_grad: 1.0
eval_every: 1
save_dir: .research/iteration5/results/smoke

run_name: full_experiment
seeds: [1, 3, 5, 7, 9]
dataset:
  name: ogbn-papers400m
  root: data/
  use_subset: false
openroad:
  url: https://zenodo.org/record/11030517/files/openroad_nyc.tar.zst
  root: data/
model:
  arch: craft
  num_layers: 512
  hid_dim: 256
  cheb_K: 16
  pool_size: 64
  dp_sigma: 0.6
  curvature_lambda: 0.1
  energy_lambda: 5.0e-4
train:
  epochs: 200
  lr: 2.5e-3
  batch_size: full
  zero_stage: 3
  warmup_pct: 0.1
  clip_grad: 1.0
hyperopt:
  trials: 50
  parallel: 3
eval_every: 5
save_dir: .research/iteration1/results/full
hardware_eval:
  orin:
    cache_kb: [64, 16]
  gap9:
    cache_kb: [64, 16]

# Ablation switches (handled outside smoke test)
ablation:
  no_tau: false
  no_phi: false
  no_curv: false

# End of file

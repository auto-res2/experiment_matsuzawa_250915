# Production-scale configuration (matches paper spec)
experiment:
  name: orion_full
  seeds: [11, 29, 97]
  runs_per_exp: 3

models:
  baseline: "OrionStarAI/Orion-14B-Base"
  orion:    "OrionStarAI/Orion-14B-Base"

datasets:
  reddit:
    hf_name: "reddit"
    split: "train[2020-01-01:2020-01-11]"
  whatsapp:
    hf_name: "pull_requester/whatsapp_10day"
    split: "train"
  emoji_chat:
    hf_name: "yhavinga/emoji-chat"
    split: "train"
  malware_sniffer:
    hf_name: "microsoft/Scarecrow"
    subset: "malware_prompts"
    split: "train"

token_injection:
  interval: 2000
  n_min: 5
  n_max: 50

training:
  batch_size: 48
  micro_batch: 4
  epochs: 2
  lr: 3.0e-4
  max_seq_len: 2048
  amp: true

lrt:
  scan_every: 6
  tau_grid: [0.7, 0.8, 0.9]

bloom:
  k_grid: [16, 32, 64]
  bits_grid: [128, 256]
  noise_sigma_grid: [0.1, 0.3, 0.5]

fcf:
  lambda_grid: [0.0, 0.3, 0.6]

output_dir: "results_full"
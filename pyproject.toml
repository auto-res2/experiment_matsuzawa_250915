[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "craft-gnn-experiments"
version = "0.1.0"
description = "Reproducible experiments for the CRaFT-GNN paper"
requires-python = ">=3.11"

dependencies = [
    # core ML stack
    "torch>=2.2.0",
    "torchdata>=0.7.1",
    # DGL – avoid 2.2.1 which lacks manylinux wheels
    "dgl>=1.2.0,<2.2.1",
    "ogb>=1.3.6",
    # experiment utilities
    "optuna>=3.4.0",
    "webdataset>=0.2.86",
    "tqdm",
    "pyyaml",
    "matplotlib>=3.8.4",
    "seaborn>=0.13.2",
    "scikit-learn>=1.4.2",
    "pynvml",
    "psutil",
    "fvcore",
    # NOTE: TVM is a heavy optional dependency used only in hardware evaluation.
    # It is intentionally omitted from the core requirements to keep installation
    # lightweight and compatible with Python 3.11 on the provided CI runner.
    "networkx>=3.3",
    # Graph Ricci curvature – correct PyPI name; latest available version is 0.5.x
    "GraphRicciCurvature>=0.5.3",
]

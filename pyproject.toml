[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astral-surrogate-experiment"
version = "0.0.1"
description = "Minimal runnable placeholder for the ASTRAL surrogate research pipeline"
requires-python = ">=3.9"
keywords = ["diffusion", "astral", "research", "placeholder"]
dependencies = [
  "torch>=2.0.0",
  "numpy>=1.21.0",
  "PyYAML>=6.0",
]

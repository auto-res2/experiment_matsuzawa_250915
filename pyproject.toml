[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "orion_experiments"
version = "1.0.0"
description = "Full-scale ORION evaluation suite – Experiments 1–3"
requires-python = ">=3.10"

[project.dependencies]
torch = ">=2.2.0"
transformers = ">=4.41.0"
datasets = ">=2.19.0"
sentencepiece = "*"
sacrebleu = ">=2.4.0"
rouge_score = ">=0.1.2"
bitarray = ">=2.9.0"
numpy = ">=1.26.4"
pandas = ">=2.2.2"
scikit-learn = ">=1.4.2"
matplotlib = ">=3.9.0"
seaborn = ">=0.13.2"
psutil = ">=5.9.8"
pynvml = ">=11.5.0"
tqdm = ">=4.66.4"
pyyaml = ">=6.0.1"
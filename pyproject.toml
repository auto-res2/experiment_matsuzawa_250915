[project]
name = "cosmicx"
version = "0.1.0"
description = "Refactored COSMIC-X experimental suite"
license = "Apache-2.0"
requires-python = ">=3.11"

# ---------------------------------------------------------------------------
# PEP-621 compliance
# ---------------------------------------------------------------------------
authors = [
  { name = "OpenAI Assistant", email = "noreply@example.com" }
]

# Runtime dependencies required for both the smoke-test and full experiments
# Note: CUDA variants of torch/torchvision are assumed pre-installed on the
# cluster, but the plain wheels work for CPU-only CI runners.
dependencies = [
  "torch>=1.13",
  "timm>=0.9.2",
  "torchvision>=0.14.0",
  "scikit-learn>=1.3.0",
  "pyyaml>=6.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]

[project]
name = "garden-experiments"
version = "0.1.0"
description = "Refactored scaffold for GARDEN continual-learning experiments"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.dependencies]
# NOTE: As per instructions, we must use array-style dependencies. The
# pyproject spec, however, only allows key-value mapping under
# [project.dependencies]. To comply with both the spec and the
# instruction, we list them here as an inline-array.
dependencies = [
  "torch>=2.0.0",
  "pyyaml>=6.0",
  "numpy>=1.21.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "craft-gnn-experiments"
version = "0.1.0"
description = "Reproducible experiments for the CRaFT-GNN paper"
requires-python = ">=3.11"

# Dependency list MUST be an array (not a mapping)
dependencies = [
  "torch>=2.2.0",
  "torchdata>=0.7.1",
  "dgl[cuda]>=1.2.0",
  "ogb>=1.3.6",
  "optuna>=3.4.0",
  "webdataset>=0.2.86",
  "tqdm",
  "pyyaml",
  "matplotlib>=3.8.4",
  "seaborn>=0.13.2",
  "scikit-learn>=1.4.2",
  "pynvml",
  "psutil",
  "fvcore",
  "tvm[cuda]>=0.13.0",
  "networkx>=3.3",
  "ricci-curvature>=0.6.2",
]

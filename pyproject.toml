[project]
name = "garden-experiments"
version = "0.1.0"
description = "Refactored scaffold for GARDEN continual-learning experiments"
requires-python = ">=3.10"

# -----------------------------------------------------------------------------
# Runtime dependencies – MUST be an *array* as per PEP 621.
# -----------------------------------------------------------------------------
dependencies = [
  "torch>=2.0.0",
  "pyyaml>=6.0",
  "numpy>=1.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
[project]
name = "cosmicx"
version = "0.1.0"
description = "Refactored COSMIC-X experimental suite"
authors = ["OpenAI Assistant <noreply@example.com>"]
license = "Apache-2.0"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# CUDA variant of torch is expected to be pre-installed on the cluster.
dependencies = [
  "torch>=1.13",
  "timm>=0.9.2",
  "torchvision>=0.14.0",
  "scikit-learn>=1.3.0",
  "pyyaml>=6.0",
]
